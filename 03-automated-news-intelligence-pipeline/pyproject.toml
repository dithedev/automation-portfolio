[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"


[project]
name = "news-intelligence-pipeline"
version = "0.1.0"
description = "A production-minded AI and automation news intelligence pipeline."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    { name = "Diana" }
]
keywords = [
    "automation",
    "artificial-intelligence",
    "rss",
    "telegram",
    "fastapi",
    "postgresql",
]

dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "apscheduler>=3.11.3,<4",
    "httpx>=0.28,<1",
    "feedparser>=6.0.14,<7",
    "pyyaml>=6,<7",
    "nh3>=0.3,<1",
    "openai>=3.11,<4",
    "aiogram>=3.31,<4",
    "tenacity>=9,<10",
    "structlog>=25,<27",
    "typer>=0.16,<1",
    "tzdata>=2026.3",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "testcontainers[postgres]>=4,<5",
    "time-machine>=2,<3",

    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.9,<3",

    "types-pyyaml>=6,<7",
]


[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]


[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/__init__.py",
    "app/api/*",
    "app/cli/*",
    "app/scheduler/*",
    "app/runtime.py",
    "app/application/cleanup.py",
    "app/infrastructure/db/*",
    "app/infrastructure/feeds/seed.py",
]


[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]


[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "alembic/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "S",
    "SIM",
    "RUF",
]
ignore = [
    "S101",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
]
"app/cli/**/*.py" = [
    "B008",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
plugins = [
    "pydantic.mypy",
]


[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "apscheduler.*",
]
ignore_missing_imports = true


[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "alembic/versions",
]
skips = [
    "B101",
]
